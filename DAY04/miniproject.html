<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="miniproject.css">
</head>
<body>
    <div class="test">
        <h3>
            <img src="image.png" height=100px weight=200px>
        </h3>
    </div>
    <div class="test1">
        <h3 font-size="30px">
            설문자 정보
        </h3>
        <p>
            이름: <input type="text" name="name" size="20"> <br>
            나이: <input type="text" name="age" size="20"> <br>
            성별: <input type="radio" name="gender" value="male">남자
                    <input type="radio" name="gender" value="female">여자 <br>
        </p><hr>
    </div>
    <div class="test2">
        <h3 font-size="30px">
            설문조사
        </h3>
        <p>
            1. 스타벅스에 얼마나 자주 방문하세요? <br>
            <input type="radio" name="visit" value="index">매일<br>
            <input type="radio" name="visit" value="index">주 1회<br>
            <input type="radio" name="visit" value="index">주 2회<br>
            <input type="radio" name="visit" value="index">~2회<br>
        </p><br>
        <p1>
            2. 스타벅스에서 어떤 메뉴를 주로 마시나요?<br>
            <input type="radio" name="menu" value="index1">아메리카노<br>
            <input type="radio" name="menu" value="index1">카페라떼<br>
            <input type="radio" name="menu" value="index1">아이스티<br>
            <input type="radio" name="menu" value="index1">그외<br>
        </p1><br>
        <p2>
            3. 스타벅스 매장 내 분위기는 어떠신가요?<br>
            <input type="radio" name="te" value="index2">매우 만족<br>
            <input type="radio" name="te" value="index2">만족<br>
            <input type="radio" name="te" value="index2">불만족<br>
            <input type="radio" name="te" value="index2">매우불만족<br>
        </p2><br>
        <p3>
            4. 스타벅스의 전반적인 서비스는 만족스러운가요?<br>
            <input type="radio" name="se" value="index3">매우 만족<br>
            <input type="radio" name="se" value="index3">만족<br>
            <input type="radio" name="se" value="index3">불만족<br>
            <input type="radio" name="se" value="index3">매우불만족<br>
        </p3><br>
        <p4>
            5. 스타벅스를 친구나 가족에게 추천하시겠습니까?<br>
            <input type="radio" name="fr" value="index4">예<br>
            <input type="radio" name="fr" value="index4">아니요<br>
        </p4><br>
    </div>
    <hr>
    <div class="test3">
        기타사항<br>
        <textarea name="value" rows="10" cols="50"></textarea>
    </div><hr>
    <div class="test4">
        작성일<input type="date"><br>
        작성시간<input type="time"><br>
    </div>
    <div class="test5">
        <button type="submit">제출하기</button>
</body>
</html>
