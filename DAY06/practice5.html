<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상품 카드</title>
    <link rel="stylesheet" href="practice5.css" />
</head>
<body>
    <div class="전체화면">
        <div class="사진영역">
            <img class="img" src="img.png" alt="파인애플">
        </div>

        <div class="내용">
            <h3 class="판매제목">프리미엄 파인애플 바구니 세트 ...</h3>
            <div class="가격">25,000원</div>
            <div class="판매내용">
                판매자가 직접 키운 파인애플입니다. 집들이, 기념일,
                병문안, 생일 등 특별한 날에 상큼한 파인애플과 함
                께...
            </div>
            <div class="리뷰및평점">
                <span class="항목">리뷰 <span class="노란색">130</span></span>
                <span class="구분선">·</span>
                <span class="항목">평점 <span class="노란색">4.9/5</span></span>
            </div>
        </div>
    </div>
</body>
</html>
